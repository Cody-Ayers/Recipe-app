{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>RecipeApp | Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    {% load static %}
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'recipes/css/style.css' %}"
    />
  </head>

  <body class="body">
    <div class="nav-bar">
      <a class="brand" href="{% url 'recipes:home' %}">The Recipe Hub</a>
      <a class="back-home_btn" href="{% url 'recipes:home' %}">Home</a>
      <a class="back-home_btn" href="{% url 'recipes:add_recipe' %}">Add</a>
      <a class="back-home_btn" href="{% url 'recipes:profile' %}">Profile</a>
      <a class="back-home_btn" href="{%url 'recipes:list' %}">List</a>
      <a class="logout_btn" href="{% url 'logout' %}">Log out</a>
    </div>

    <div class="list_table">
      <p style="color: var(--muted); margin: 0 0 4px; font-size: 13px">
        Find something to cook
      </p>
      <h1>Search the board</h1>

      <form action="" method="POST">
        {% csrf_token %}
        <div class="form-field">{{form}}</div>
        <button type="submit">Search</button>
      </form>

      {% if recipe_df %}
      <div style="overflow-x: auto; margin-top: 24px">{{recipe_df|safe}}</div>
      <img
        style="margin-top: 20px"
        src="data:image/png;base64, {{chart|safe}}"
        alt="chart"
      />
      {% else %}
      <h3 style="margin-top: 24px">No data yet — run a search above.</h3>
      {% endif %}
    </div>
  </body>
</html>
