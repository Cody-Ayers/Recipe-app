{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>RecipeApp | Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    {% load static %}
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'recipes/css/style.css' %}"
    />
  </head>

  <body class="body">
    <div class="auth">
      <a class="auth-brand" href="{% url 'recipes:home' %}">The Recipe Hub</a>
      <p class="auth-tagline">Tonight's board is waiting.</p>
      <h1>Sign up</h1>
      {% if form.errors %}
      <p style="color: var(--danger)">
        Please fix the errors below and try again.
      </p>
      {% endif %}
      <form action="" method="POST">
        {% csrf_token %}
        <div class="form-field">{{ form }}</div>
        <button type="submit">Create account</button>
      </form>
      <p style="margin-top: 16px; font-size: 13px; color: var(--muted)">
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
      </p>
      <p class="auth-browse">
        <a href="{% url 'recipes:list' %}">Just looking? Browse recipes &rarr;</a>
      </p>
    </div>
  </body>
</html>
